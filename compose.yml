services:
  reprolab:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: http://localhost:3000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env.local or the deployment environment}
      MONGODB_DB: ${MONGODB_DB:-reprolab}
      RETENTION_DAYS: "14"
    restart: unless-stopped
