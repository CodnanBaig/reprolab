name: Vercel adapter verification
on:
  push:
    branches: [feat/vercel-durable-hosting, main, feature/initial-source-publication]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix hosting
      - run: pnpm run typecheck
      - run: pnpm exec tsc --noEmit -p hosting/tsconfig.json
      - run: pnpm run check:syntax
      - name: Original, async adapter and durability contracts
        run: node --experimental-strip-types --test tests/*.test.ts hosting/*.test.ts
      - run: pnpm run build
      - name: Hosted dependency advisory check
        run: npm audit --prefix hosting --omit=dev --audit-level=high
      - name: Retain exact non-secret source candidate
        run: |
          mkdir -p test-artifacts/hosting
          git rev-parse HEAD > test-artifacts/hosting/commit.txt
          git archive --format=tar.gz HEAD > test-artifacts/hosting/source.tar.gz
          sha256sum test-artifacts/hosting/source.tar.gz > test-artifacts/hosting/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reprolab-vercel-candidate-${{ github.run_id }}
          path: test-artifacts/hosting/
          retention-days: 7
